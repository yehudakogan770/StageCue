<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StageCue - Reset Password</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#17181c" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="landing">
    <div class="card join-card">
      <span class="brand-mark brand-mark-lg start-brand"><svg class="cue-mark" viewBox="0 0 24 24" fill="none"><path d="M3 20h18" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/><path d="M7 6v12l11-6-11-6z" fill="var(--accent)"/></svg><span class="mark-word">Stage<span class="hi">Cue</span></span></span>
      <h1>Reset Password</h1>

      <div id="resetFormBox">
        <p>Choose a new password for your account.</p>
        <form id="resetPasswordForm" class="stacked-form">
          <input id="newPassword" type="password" placeholder="New password (4+ characters)" required minlength="4" autocomplete="new-password" />
          <button type="submit" class="btn btn-primary btn-full">Reset Password</button>
        </form>
        <p id="resetError" class="error hidden"></p>
      </div>

      <div id="resetSuccessBox" class="hidden">
        <p>Your password has been reset.</p>
        <a href="/player" class="btn btn-primary btn-full">Go to Login</a>
      </div>

      <div id="resetInvalidBox" class="hidden">
        <p>This reset link is invalid or missing a token. Request a new one from the login screen.</p>
      </div>
    </div>
  </div>
  <script src="/js/reset-password.js"></script>
  <script src="/js/sw-register.js"></script>
</body>
</html>
