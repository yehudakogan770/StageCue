<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StageCue</title>
<meta name="description" content="StageCue connects the keyboard player to the singer with live cues and lyrics — no more mid-song shouting or hand signals." />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#17181c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="StageCue" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="landing">
    <div class="panel-unit card">
      <div class="unit-plate">
        <span class="brand-mark brand-mark-lg">
          <svg class="cue-mark" viewBox="0 0 24 24" fill="none"><path d="M3 20h18" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/><path d="M7 6v12l11-6-11-6z" fill="var(--accent)"/></svg>
          <span class="mark-word">Stage<span class="hi">Cue</span></span>
        </span>
      </div>

      <p class="unit-desc">Pick your side of the show.</p>

      <div class="unit-switches">
        <a class="switch player" href="/player">
          <span class="sw-label">Keyboard Player</span>
          <span class="sw-sub">Set up songs and send live cues</span>
        </a>
        <a class="switch singer" href="/singer">
          <span class="sw-label">Singer</span>
          <span class="sw-sub">Join with a code and follow along</span>
        </a>
      </div>
    </div>
  </div>
  <script src="/js/sw-register.js"></script>
</body>
</html>
