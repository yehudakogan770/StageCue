<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StageCue</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="landing">
    <div>
      <h1>StageCue</h1>
      <p class="tagline">Cue the singer, without saying a word.</p>
    </div>
    <div class="role-cards">
      <a class="role-card card" href="/player">
        <div class="role-icon">&#127929;</div>
        <h2>Keyboard Player</h2>
        <p>Run the show: manage songs, playlists and presets, and send lyrics or messages live.</p>
      </a>
      <a class="role-card card" href="/singer">
        <div class="role-icon">&#127908;</div>
        <h2>Singer</h2>
        <p>Join with a code from the keyboard player and see cues and lyrics live.</p>
      </a>
    </div>
  </div>
</body>
</html>
